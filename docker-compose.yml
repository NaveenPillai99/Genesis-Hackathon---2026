version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./campusconnect.db
      - SECRET_KEY=campusconnect_hackathon_secret_key_2026_super_secure
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./spacehub
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
